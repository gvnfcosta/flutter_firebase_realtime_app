name: flutter_firebase_realtime_app
description: Firebase Realtime Database + Auth + Provider
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  connectivity_plus: ^4.0.1
  flutter_lints: ^6.0.0
  firebase_core: ^3.3.0
  firebase_auth: ^5.3.0
  firebase_database: ^11.1.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  get: ^4.7.2

  
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

