name: flutter_firebase_realtime_app
description: Firebase Realtime Database + Auth + Provider
publish_to: "none"
version: 1.0.0+1

environment:
 sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  animated_text_kit: ^4.3.0
  connectivity_plus: ^4.0.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_database: ^11.3.10
  flutter_lints: ^6.0.0
  get: ^4.7.2  
  intl: ^0.20.2
  mask_text_input_formatter: ^2.9.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2

  
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Arbotek
      fonts:
        - asset: assets/fonts/Arbotek-Thin.ttf
        - asset: assets/fonts/Arbotek-Light.otf
          weight: 100
        - asset: assets/fonts/Arbotek-Light.ttf
          weight: 100
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
